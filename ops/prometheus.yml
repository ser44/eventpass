global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # api y worker son el mismo código con perfiles distintos (§3); cada uno
  # expone /api/v1/actuator/prometheus en su propio puerto. Prometheus entra
  # directo por la red interna de Docker (nginx NO proxea /actuator, §6.4).
  - job_name: eventpass-api
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  - job_name: eventpass-worker
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ["worker:8081"]
        labels:
          service: worker
