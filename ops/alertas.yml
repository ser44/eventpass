groups:
  - name: eventpass
    rules:
      - alert: ReservasP95Alto
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{uri="/events/{id}/reservations", method="POST"}[5m])) by (le)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 de POST /reservations por encima de 800 ms"
          description: "El percentil 95 de latencia de la reserva lleva más de 5 minutos por encima de 800 ms."

      - alert: OutboxPendientesAlto
        expr: eventpass_outbox_pendientes > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Más de 100 mensajes pendientes en la outbox"
          description: "El despachador de la outbox no está drenando la cola al ritmo esperado."

      - alert: ReservasVencidasSinProcesar
        expr: eventpass_reservas_vencidas_sin_procesar > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hay reservas vencidas que el worker no está procesando"
          description: "ExpiracionReservasJob no está liberando cupo vencido; revisar el worker."

      - alert: CheckInsYaUsadaAlto
        expr: sum(rate(eventpass_checkin_total{resultado="ya_usada"}[1m])) * 60 > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Más de 5 check-ins 'ya_usada' por minuto"
          description: "Puede indicar reventa de QR o un problema en el flujo de check-in."

      - alert: Tasa5xxAlta
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de 5xx por encima del 2%"
          description: "Más del 2% de las respuestas del backend son errores de servidor."

      - alert: TargetCaido
        expr: up{job=~"eventpass-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Un target de EventPass está caído"
          description: "Prometheus dejó de poder scrapear {{ $labels.job }}."
