# Override de DESARROLLO
# Agrega Mailpit y expone puertos internos para depurar.
services:

  db:
    ports:
      - "127.0.0.1:5433:5432"  # PostgreSQL Docker accesible desde DBeaver

  api:
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
