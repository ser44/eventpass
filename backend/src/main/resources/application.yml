spring:
  application:
    name: eventpass
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventpass}
    username: ${DB_USER:eventpass}
    password: ${DB_PASSWORD:eventpass}
  jpa:
    hibernate:
      ddl-auto: none            # Flyway es el dueño del esquema
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: America/Argentina/Buenos_Aires
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  servlet:
    context-path: /api/v1       # health => /api/v1/actuator/health; API => /api/v1/events...

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false   # la salud no depende del SMTP (las notificaciones van por outbox)

# Parámetros de negocio (configurables por entorno)
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-cambiar-por-uno-de-32-bytes-minimo}
  reserva:
    ttl-minutos: ${APP_RESERVA_TTL_MINUTOS:10}
    cancelacion-horas: 48
  notificacion:
    canal: ${APP_NOTIFICACION_CANAL:email}   # email (Mailpit) | log
