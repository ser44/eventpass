server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Headers de seguridad básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy de la API hacia el backend (el navegador ve un único origen -> sin CORS).
    # Usamos el resolver DNS interno de Docker (127.0.0.11) + variable en proxy_pass
    # para que nginx re-resuelva la IP de `api` en runtime: así sobrevive a que el
    # contenedor `api` se recree (rebuild) sin quedar con una IP vieja (evita 502).
    # Nota: /api/v1/actuator/prometheus queda accesible acá solo hasta la Fase 6.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre -> cache larga e inmutable.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta cae en index.html (Angular router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
