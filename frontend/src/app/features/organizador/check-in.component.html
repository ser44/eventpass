<div class="checkin">
  @if (estado() === 'ok') {
    <div class="resultado verde">
      <mat-icon>check_circle</mat-icon>
      <h1>Entrada válida</h1>
      @if (titular()) { <p class="titular">{{ titular() }}</p> }
    </div>
  } @else if (estado() === 'error') {
    <div class="resultado rojo">
      <mat-icon>cancel</mat-icon>
      <h1>{{ mensajeError() }}</h1>
    </div>
  } @else {
    <div class="escaner">
      <div class="barra-sup">
        <a mat-icon-button routerLink="/organizador" aria-label="Volver"><mat-icon>arrow_back</mat-icon></a>
        <span>Check-in</span>
        @if (camaras().length > 1) {
          <select class="sel-camara" (change)="cambiarCamara($any($event.target).value)">
            @for (c of camaras(); track c.deviceId) {
              <option [value]="c.deviceId" [selected]="c.deviceId === camaraActual()?.deviceId">
                {{ c.label || 'Cámara' }}
              </option>
            }
          </select>
        }
      </div>

      <zxing-scanner
        class="camara"
        [formats]="formats"
        [device]="camaraActual()"
        (camerasFound)="onCamaras($event)"
        (scanSuccess)="onScan($event)">
      </zxing-scanner>

      @if (estado() === 'validando') {
        <div class="validando">Validando…</div>
      }

      <form class="manual" (ngSubmit)="validarManual()">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>Ingresar código manual</mat-label>
          <input matInput name="codigo" [(ngModel)]="codigoManual" placeholder="EVP-XXXX-XXXX-XXXX" />
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit">Validar</button>
      </form>
    </div>
  }
</div>
