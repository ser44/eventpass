<div class="mis-entradas">
  <h1>Mis entradas</h1>

  @if (cargando()) {
    <app-loading></app-loading>
  } @else if (error()) {
    <app-empty-state icono="error" mensaje="No se pudieron cargar tus entradas."></app-empty-state>
  } @else if (grupos().length === 0) {
    <app-empty-state icono="confirmation_number" mensaje="Todavía no tenés entradas."></app-empty-state>
  } @else {
    @for (g of grupos(); track g.reservaId) {
      <app-ticket-group [grupo]="g" (cancelar)="cancelar(g)"></app-ticket-group>
    }
  }
</div>
