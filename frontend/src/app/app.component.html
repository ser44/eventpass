<mat-sidenav-container class="layout">
  <mat-sidenav
    #snav
    [mode]="esCompacto() ? 'over' : 'side'"
    [opened]="!esCompacto()"
    class="sidenav">
    <mat-nav-list>
      @for (link of links(); track link.ruta) {
        <a
          mat-list-item
          [routerLink]="link.ruta"
          routerLinkActive="activo"
          (click)="esCompacto() && snav.close()">
          <mat-icon matListItemIcon>{{ link.icono }}</mat-icon>
          <span matListItemTitle>{{ link.texto }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      @if (esCompacto()) {
        <button mat-icon-button aria-label="Abrir menú" (click)="snav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="titulo">EventPass</span>
      <span class="spacer"></span>

      @if (auth.estaAutenticado()) {
        <button mat-button [matMenuTriggerFor]="menu" aria-label="Menú de usuario">
          <mat-icon>account_circle</mat-icon>
          <span class="nombre-usuario">{{ auth.usuario()?.nombre }}</span>
        </button>
        <mat-menu #menu="matMenu">
          <div class="menu-rol" mat-menu-item disabled>{{ auth.usuario()?.rol }}</div>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Salir</span>
          </button>
        </mat-menu>
      } @else {
        <a mat-button routerLink="/login">Ingresar</a>
        <a mat-button routerLink="/registro">Registrarse</a>
      }
    </mat-toolbar>

    <main class="contenido">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
